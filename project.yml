name: VideoGrab

options:
  bundleIdPrefix: com.videograb
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 关键：必须显式指定。
  # XcodeGen 默认生成 xcode16_0 格式（objectVersion 77），而 GitHub runner 上
  # 只有 Xcode 15.4，读不了会报 "cannot be opened because it is in a future
  # Xcode project file format (77)"。上一轮就是踩了这个坑。
  projectFormat: xcode15_3

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

# FFmpeg 预编译静态库由 CI 下载到 vendor/FFmpeg（见 build.yml），
# 通过 LIBRARY_SEARCH_PATHS + OTHER_LDFLAGS 手动挂链接。
# （SPM 路线实测走不通：Xcode 15.4 的 SPM 不允许 revision 锁定的包再依赖其他包）
targets:
  VideoGrab:
    type: application
    platform: iOS
    sources:
      # Info.plist 由下面的 info.path 生成，不能当源码/资源扫进来
      - path: app
        excludes:
          - "Info.plist"
      - path: resources
        buildPhase: resources
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: 视频抓取
        CFBundleName: VideoGrab
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # 后台保活：画中画（PiP）归在这条背景模式里。
        # App 进后台时用 sample-buffer PiP 把下载进度画进小窗，
        # 系统据此继续给运行时间 —— 这样锁屏/切走时下载和转码不会停。
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 注意：这里**故意不开** UIFileSharingEnabled / LSSupportsOpeningDocumentsInPlace。
        # 需求是视频留在程序内（Application Support 私有目录），由用户自己点
        # 「存相册」或「存文件夹」决定要不要出去。开了这两个键，
        # Documents 会被系统「文件」App 自动列出来，那就等于自动转出程序了。
        # 用户主动导出走的是 UIDocumentPickerViewController(forExporting:)，不受影响。
        #
        # 存相册要的权限说明
        NSPhotoLibraryAddUsageDescription: 用于把你下载并转好的视频保存到系统相册（只在你点「存相册」时写入）。
        # 采集源的 m3u8 和分片常常是 http，放开 ATS（自用，不上架）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # App 内会起一个 HTTP 服务：默认只绑 127.0.0.1，把本地 .ts 以 HLS 形式
        # 提供给 AVPlayer（本地 ts / 本地 m3u8 都读不了，只能走 http）。
        # 用户点「共享给电脑」时才改绑 0.0.0.0（同一 Wi-Fi 可见，带口令）。
        NSLocalNetworkUsageDescription: 用于把手机里下载好的视频通过 Wi-Fi 提供给你自己的电脑浏览器下载（只有你点「共享给电脑」时才会开启，并带访问口令）。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videograb.app
        TARGETED_DEVICE_FAMILY: "1,2"
        # App 图标：app/Assets.xcassets/AppIcon.appiconset
        # ★ 必须放「每个尺寸一张真图」的完整清单（20/29/40/60 的 @2x+@3x、
        #   iPad 全套、1024 营销图），不要只放一张单尺寸 1024 交给 actool 派生。
        #   实测：只放单尺寸 1024 时，打出来的包里只有 AppIcon60x60@2x.png，
        #   缺 iPhone 用的 @3x(180x180)；而 Info.plist 里
        #   CFBundleIconFiles = ["AppIcon60x60"]，系统在 @3x 设备上按这个名去找
        #   @3x 那张，找不到就显示白块 —— 任务切换器卡片没图标就是这么来的。
        #   清单由 _probe_tmp/make_appicon_set.py 生成；换图标后重跑那个脚本。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FFmpeg 静态库（设备切片 ios-arm64）。顺序有讲究：静态库是单趟
        # 解析，被依赖的库要排在依赖者后面（fftools -> ... -> avutil 收尾）。
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/vendor/FFmpeg/fftools.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avdevice.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avfilter.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avformat.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avcodec.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/swscale.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/swresample.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avutil.xcframework/ios-arm64"
        OTHER_LDFLAGS:
          - "-lfftools"
          - "-lavdevice"
          - "-lavfilter"
          - "-lavformat"
          - "-lavcodec"
          - "-lswscale"
          - "-lswresample"
          - "-lavutil"
          - "-lz"
          - "-lbz2"
          - "-liconv"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreVideo"
        # FFmpeg 转码用的 C 入口（app/Hook.m）经桥接头暴露给 Swift
        SWIFT_OBJC_BRIDGING_HEADER: app/VideoGrab-Bridging-Header.h

# XcodeGen 不会自动生成 scheme（是 opt-in 的），必须显式声明，
# 否则 xcodebuild -scheme 会找不到目标。
schemes:
  VideoGrab:
    build:
      targets:
        VideoGrab: all
    run:
      config: Release
    archive:
      config: Release
