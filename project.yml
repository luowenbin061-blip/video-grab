name: VideoGrab

options:
  bundleIdPrefix: com.videograb
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 关键：必须显式指定。
  # XcodeGen 默认生成 xcode16_0 格式（objectVersion 77），而 GitHub runner 上
  # 只有 Xcode 15.4，读不了会报 "cannot be opened because it is in a future
  # Xcode project file format (77)"。上一轮就是踩了这个坑。
  projectFormat: xcode15_3

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

# FFmpeg 预编译静态库由 CI 下载到 vendor/FFmpeg（见 build.yml），
# 通过 LIBRARY_SEARCH_PATHS + OTHER_LDFLAGS 手动挂链接。
# （SPM 路线实测走不通：Xcode 15.4 的 SPM 不允许 revision 锁定的包再依赖其他包）
targets:
  VideoGrab:
    type: application
    platform: iOS
    sources:
      # Info.plist 由下面的 info.path 生成，不能当源码/资源扫进来
      - path: app
        excludes:
          - "Info.plist"
      - path: resources
        buildPhase: resources
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: 视频抓取
        CFBundleName: VideoGrab
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 注意：这里**故意不开** UIFileSharingEnabled / LSSupportsOpeningDocumentsInPlace。
        # 需求是视频留在程序内（Application Support 私有目录），由用户自己点
        # 「存相册」或「存文件夹」决定要不要出去。开了这两个键，
        # Documents 会被系统「文件」App 自动列出来，那就等于自动转出程序了。
        # 用户主动导出走的是 UIDocumentPickerViewController(forExporting:)，不受影响。
        #
        # 存相册要的权限说明
        NSPhotoLibraryAddUsageDescription: 用于把你下载并转好的视频保存到系统相册（只在你点「存相册」时写入）。
        # 采集源的 m3u8 和分片常常是 http，放开 ATS（自用，不上架）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # App 内会起一个只绑 127.0.0.1 的 HTTP 服务，把本地 .ts 以 HLS 形式
        # 提供给 AVPlayer（本地 ts / 本地 m3u8 都读不了，只能走 http）。
        # 回环本来不需要本地网络权限，这里声明一句是保险。
        NSLocalNetworkUsageDescription: 用于在本机把下载好的视频提供给播放器读取（只绑 127.0.0.1，不对外）。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.videograb.app
        TARGETED_DEVICE_FAMILY: "1,2"
        # App 图标：app/Assets.xcassets/AppIcon.appiconset（单尺寸 1024，
        # Xcode 14+ 支持，actool 编译时自动生成全部尺寸并写进 Info.plist）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FFmpeg 静态库（设备切片 ios-arm64）。顺序有讲究：静态库是单趟
        # 解析，被依赖的库要排在依赖者后面（fftools -> ... -> avutil 收尾）。
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/vendor/FFmpeg/fftools.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avdevice.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avfilter.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avformat.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avcodec.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/swscale.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/swresample.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/vendor/FFmpeg/avutil.xcframework/ios-arm64"
        OTHER_LDFLAGS:
          - "-lfftools"
          - "-lavdevice"
          - "-lavfilter"
          - "-lavformat"
          - "-lavcodec"
          - "-lswscale"
          - "-lswresample"
          - "-lavutil"
          - "-lz"
          - "-lbz2"
          - "-liconv"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreVideo"
        # FFmpeg 转码用的 C 入口（app/Hook.m）经桥接头暴露给 Swift
        SWIFT_OBJC_BRIDGING_HEADER: app/VideoGrab-Bridging-Header.h

# XcodeGen 不会自动生成 scheme（是 opt-in 的），必须显式声明，
# 否则 xcodebuild -scheme 会找不到目标。
schemes:
  VideoGrab:
    build:
      targets:
        VideoGrab: all
    run:
      config: Release
    archive:
      config: Release
